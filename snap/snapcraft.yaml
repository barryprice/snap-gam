name: gam-bp
title: GAM
summary: GAM is a command line tool for Google Workspace admins.
description: |
   GAM is a command line tool that allows administrators to manage many aspects
   of their Google Workspace (formerly G Suite / Google Apps) Account.
adopt-info: gam
confinement: strict
grade: stable
base: core26
platforms:
  amd64:
  arm64:

apps:
  gam:
    command: bin/gam
    plugs:
      - network
      - network-bind
    environment:
      GAMCFGDIR: "$SNAP_USER_COMMON/.config/"
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.14/site-packages:$PYTHONPATH

parts:
  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal # for the "python3" symlink
      - python3.14-minimal
      - python3.14-venv
  gam:
    after: [python-runtime]
    plugin: python
    source: https://github.com/GAM-team/GAM.git
    build-packages:
      - curl
      - libpcsclite-dev
      - swig
    override-pull: |
      craftctl default
      # build the latest tagged release, skip "v722.01" missing a decimal!
      latest_tag=$(git tag --list | grep '^v' | grep -v 'v722.01' | tail -1)
      git checkout "${latest_tag?}"
      craftctl set version=$(echo "${latest_tag?}" | sed 's/^v//')
      # remove cruft (src/{LICENSE,README.md} are just symlinks to {LICENSE,README.md})
      rm -rf src/.gitignore src/LICENSE src/README.md
      # work around case-sensitivity issue
      [ -f README.md ] && ln -s README.md readme.md
      # this will be created later, but let's pre-populate it now
      mkdir -p "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/
      # retrieve roots.pem and stage it in site-packages
      curl -o "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/roots.pem https://pki.goog/roots.pem
      # create behavioural override files and stage them also
      touch "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/noupdatecheck.txt
      touch "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/noshorturls.txt
      # copy documentation file
      mkdir -p "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/gam
      cp -v src/GamCommands.txt "$CRAFT_PART_INSTALL"/lib/python3.14/site-packages/gam/
